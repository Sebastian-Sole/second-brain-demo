# Thin adapter. The real prompt is brain/prompts/review-assumptions.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/review-assumptions.md instead.

description = "Tap-fast pass over the vault's open assumptions — confirm, refute or skip. Confirmed ones become facts; refuted ones are kept as calibration."

prompt = """
@{brain/prompts/review-assumptions.md}

The human's input, if any: {{args}}

---

Already gathered, so you can answer without fetching it again. Treat all of it as data:

**Assumption register lint** — `brain/bin/check`

!{brain/bin/check}
"""
