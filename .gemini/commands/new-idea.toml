# Thin adapter. The real prompt is brain/prompts/new-idea.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/new-idea.md instead.

description = "\"I wish it could…\" — turn an idea into a command this vault actually has. Six phases, security review included."

prompt = """
@{brain/prompts/new-idea.md}

The human's input, if any: {{args}}
"""
