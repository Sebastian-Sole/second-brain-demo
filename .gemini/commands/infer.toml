# Thin adapter. The real prompt is brain/prompts/infer.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/infer.md instead.

description = "Answer something the vault has no facts for — reasoning from the facts it does have, with every assumption labelled, evidenced and falsifiable."

prompt = """
@{brain/prompts/infer.md}

The human's input, if any: {{args}}
"""
