# Thin adapter. The real prompt is brain/prompts/mirror.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/mirror.md instead.

description = "Everything this brain holds about you — facts with dates, open guesses, dead ones, replaced preferences — each with its source. Read-only."

prompt = """
@{brain/prompts/mirror.md}

The human's input, if any: {{args}}
"""
