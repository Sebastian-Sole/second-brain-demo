# Thin adapter. The real prompt is brain/prompts/explain.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/explain.md instead.

description = "Teach you something new, pitched at how you learn and what you already know."

prompt = """
@{brain/prompts/explain.md}

The human's input, if any: {{args}}
"""
