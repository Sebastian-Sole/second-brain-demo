# Thin adapter. The real prompt is brain/tools/calendar.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/tools/calendar.md instead.

description = "Read your schedule and answer from it — creates an event only when you ask and approve."

prompt = """
@{brain/tools/calendar.md}

The human's input, if any: {{args}}
"""
