# Thin adapter. The real prompt is brain/prompts/guide.md, shared by every agent — @{} inlines it here
# rather than copying it, so there is still one manual. Gemini CLI and Claude Code can expand
# a file and a command's output into the prompt before the agent sees it; Codex and Copilot
# can do neither, and their wrappers still say "read the file", which costs them one round
# trip and nothing else. Do not add instructions here — edit brain/prompts/guide.md instead.

description = "Learn what this thing is and how far it goes — pitched at your level, from \"never used AI\" upward. `guide expand` for what to build next."

prompt = """
@{brain/prompts/guide.md}

The human's input, if any: {{args}}
"""
